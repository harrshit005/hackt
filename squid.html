<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Squid Glass Game</title>

<style>
    body {
        background: linear-gradient(180deg, #020617, #020617);
        color: white;
        font-family: Arial;
        text-align: center;
    }

    h1 {
        margin-top: 20px;
    }

    #points {
        font-size: 22px;
        margin-bottom: 20px;
    }

    .row {
        display: flex;
        justify-content: center;
        margin: 12px 0;
    }

    .box {
        width: 120px;
        height: 60px;
        margin: 0 10px;
        background: #334155;
        border-radius: 10px;
        cursor: not-allowed;
        line-height: 60px;
        font-size: 18px;
        font-weight: bold;
        transition: 0.3s;
        opacity: 0.5;
    }

    .active {
        cursor: pointer;
        opacity: 1;
    }

    .box:hover.active {
        background: #475569;
    }

    .safe {
        background: #16a34a !important;
    }

    .fall {
        background: #dc2626 !important;
    }

    #status {
        margin-top: 20px;
        font-size: 20px;
    }

    button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h1>🦑 Squid Glass Game</h1>
<div id="points">Points: 0</div>

<div id="game"></div>
<div id="status"></div>

<button onclick="restart()">Restart Game</button>

<script>
const TOTAL_LEVELS = 12;
let currentLevel = 0;
let points = 0;
let gameOver = false;

const gameDiv = document.getElementById("game");
const statusDiv = document.getElementById("status");
const pointsDiv = document.getElementById("points");

let safePath = [];

// generate safe path
for (let i = 0; i < TOTAL_LEVELS; i++) {
    if (i < 2) {
        safePath.push(-1); // both safe
    } else {
        safePath.push(Math.floor(Math.random() * 2));
    }
}

// create all rows at once
for (let i = 0; i < TOTAL_LEVELS; i++) {
    const row = document.createElement("div");
    row.className = "row";

    for (let j = 0; j < 2; j++) {
        const box = document.createElement("div");
        box.className = "box";
        box.innerText = "Choose";

        box.onclick = () => handleClick(i, j, box, row);

        row.appendChild(box);
    }
    gameDiv.appendChild(row);
}

// activate first row
activateRow(0);

function handleClick(rowIndex, boxIndex, box, row) {
    if (gameOver || rowIndex !== currentLevel) return;

    const safe = safePath[rowIndex];

    if (safe === -1 || boxIndex === safe) {
        box.classList.add("safe");
        points += 10;
        pointsDiv.innerText = "Points: " + points;

        disableRow(row);

        currentLevel++;
        if (currentLevel < TOTAL_LEVELS) {
            activateRow(currentLevel);
        } else {
            statusDiv.innerText = "🎉 You Won the Game!";
        }
    } else {
        box.classList.add("fall");
        statusDiv.innerText = "❌ You Fell! Game Over";
        gameOver = true;
    }
}

function activateRow(index) {
    const row = gameDiv.children[index];
    Array.from(row.children).forEach(b => {
        b.classList.add("active");
        b.style.cursor = "pointer";
        b.style.opacity = "1";
    });
}

function disableRow(row) {
    Array.from(row.children).forEach(b => {
        b.classList.remove("active");
        b.style.cursor = "not-allowed";
        b.style.opacity = "0.7";
    });
}

function restart() {
    location.reload();
}
</script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

    apiKey: "PASTE_FROM_FIREBASE",
    authDomain: "PASTE_FROM_FIREBASE",
    databaseURL: "PASTE_FROM_FIREBASE",
    projectId: "PASTE_FROM_FIREBASE",
    storageBucket: "PASTE_FROM_FIREBASE",
    messagingSenderId: "PASTE_FROM_FIREBASE",
    appId: "PASTE_FROM_FIREBASE"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
</script>

</body>
</html>
