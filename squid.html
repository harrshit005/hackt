<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Squid Glass Game</title>

<style>
    body {
        background: #0f172a;
        color: white;
        font-family: Arial;
        text-align: center;
    }

    h1 {
        margin-top: 20px;
    }

    #points {
        font-size: 22px;
        margin: 10px;
    }

    .row {
        display: flex;
        justify-content: center;
        margin: 10px;
    }

    .box {
        width: 100px;
        height: 60px;
        margin: 10px;
        background: #334155;
        border-radius: 8px;
        cursor: pointer;
        line-height: 60px;
        font-weight: bold;
        transition: 0.3s;
    }

    .box:hover {
        background: #475569;
    }

    .safe {
        background: #16a34a !important;
    }

    .fall {
        background: #dc2626 !important;
    }

    #status {
        margin-top: 15px;
        font-size: 18px;
    }

    button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h1>🦑 Squid Glass Game</h1>
<div id="points">Points: 0</div>
<div id="game"></div>
<div id="status"></div>

<button onclick="restart()">Restart Game</button>

<script>
let level = 1;
let points = 0;
let gameOver = false;

const gameDiv = document.getElementById("game");
const statusDiv = document.getElementById("status");
const pointsDiv = document.getElementById("points");

function createRow() {
    if (level > 12 || gameOver) return;

    const row = document.createElement("div");
    row.className = "row";

    let safeBox;

    if (level <= 2) {
        safeBox = 0; // both pass, logic forced safe
    } else {
        safeBox = Math.floor(Math.random() * 2);
    }

    for (let i = 0; i < 2; i++) {
        const box = document.createElement("div");
        box.className = "box";
        box.innerText = "Choose";

        box.onclick = () => {
            if (gameOver) return;

            if (level <= 2 || i === safeBox) {
                box.classList.add("safe");
                points += 10;
                level++;
                pointsDiv.innerText = "Points: " + points;
                statusDiv.innerText = "Level Passed ✅";
                setTimeout(createRow, 600);
            } else {
                box.classList.add("fall");
                statusDiv.innerText = "❌ You Fell! Game Over";
                gameOver = true;
            }

            Array.from(row.children).forEach(b => b.onclick = null);
        };

        row.appendChild(box);
    }

    gameDiv.appendChild(row);
}

function restart() {
    level = 1;
    points = 0;
    gameOver = false;
    gameDiv.innerHTML = "";
    statusDiv.innerText = "";
    pointsDiv.innerText = "Points: 0";
    createRow();
}

createRow();
</script>

</body>
</html>
