<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Squid Glass Game</title>

<style>
body{
  background:#020617;color:white;font-family:Arial;text-align:center;
}
.row{display:flex;justify-content:center;margin:10px}
.box{
  width:120px;height:60px;margin:0 10px;
  background:#334155;border-radius:8px;
  line-height:60px;font-weight:bold;
  cursor:not-allowed;opacity:.5;
}
.active{cursor:pointer;opacity:1}
.safe{background:#16a34a!important}
.fall{background:#dc2626!important}

/* overlays */
.overlay{
  display:none;position:fixed;inset:0;
  background:#000a;display:flex;
  align-items:center;justify-content:center;
}
.card{
  background:#111;padding:20px;
  border-radius:10px;width:280px;
}
button{padding:10px;width:100%;margin-top:10px;cursor:pointer}
</style>
</head>

<body>

<h1>🦑 Squid Glass Game</h1>
<div id="points">Points: 0</div>
<div id="game"></div>

<button onclick="restart()">Restart</button>

<!-- RESULT BOX -->
<div id="resultBox" class="overlay">
  <div class="card">
    <h2 id="resultText">Game Over</h2>
    <p id="finalScore">Score: 0</p>
    <button style="background:#22c55e;border:none;color:white"
      onclick="showSaveBox()">Save Score</button>
  </div>
</div>

<!-- SAVE BOX -->
<div id="authBox" class="overlay">
  <div class="card">
    <h3>Save Your Score</h3>
    <input id="playerName" placeholder="Username"
      style="width:100%;padding:8px">
    <button style="background:#22c55e;border:none;color:white"
      onclick="saveScore()">Save</button>
  </div>
</div>

<script>
const TOTAL_LEVELS = 12;
let currentLevel = 0;
let points = 0;
let gameOver = false;

const gameDiv = document.getElementById("game");
const pointsDiv = document.getElementById("points");

let safePath=[];
for(let i=0;i<TOTAL_LEVELS;i++){
  safePath.push(i<2 ? -1 : Math.floor(Math.random()*2));
}

for(let i=0;i<TOTAL_LEVELS;i++){
  const row=document.createElement("div");
  row.className="row";
  for(let j=0;j<2;j++){
    const box=document.createElement("div");
    box.className="box";
    box.innerText="Choose";
    box.onclick=()=>handleClick(i,j,box,row);
    row.appendChild(box);
  }
  gameDiv.appendChild(row);
}
activateRow(0);

function handleClick(r,c,box,row){
  if(gameOver||r!==currentLevel) return;

  const safe=safePath[r];
  if(safe===-1||c===safe){
    box.classList.add("safe");
    points+=10;
    pointsDiv.innerText="Points: "+points;
    disableRow(row);
    currentLevel++;
    if(currentLevel<TOTAL_LEVELS){
      activateRow(currentLevel);
    }else{
      showResult("🎉 You Won!");
    }
  }else{
    box.classList.add("fall");
    gameOver=true;
    showResult("❌ You Fell!");
  }
}

function activateRow(i){
  const row=gameDiv.children[i];
  [...row.children].forEach(b=>{
    b.classList.add("active");
    b.style.cursor="pointer";
    b.style.opacity="1";
  });
}
function disableRow(row){
  [...row.children].forEach(b=>{
    b.classList.remove("active");
    b.style.cursor="not-allowed";
    b.style.opacity=".5";
  });
}
function restart(){location.reload();}

/* RESULT + SAVE FLOW */
function showResult(msg){
  document.getElementById("resultText").innerText=msg;
  document.getElementById("finalScore").innerText="Score: "+points;
  document.getElementById("resultBox").style.display="flex";
}
function showSaveBox(){
  document.getElementById("resultBox").style.display="none";
  document.getElementById("authBox").style.display="flex";
}
</script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDgCwip2qLiHKPcndENP0-PogHONsFaCpg",
  authDomain: "glass-game-a61c4.firebaseapp.com",
  databaseURL: "https://glass-game-a61c4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "glass-game-a61c4",
  storageBucket: "glass-game-a61c4.appspot.com",
  messagingSenderId: "396217167380",
  appId: "1:396217167380:web:5ea65a21e10d39273d4101"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function saveScore(){
  const name=document.getElementById("playerName").value.trim();
  if(!name){alert("Enter username");return;}

  db.ref("scores").push({
    username:name,
    points:points,
    time:new Date().toISOString()
  }).then(()=>{
    alert("Score saved!");
    document.getElementById("authBox").style.display="none";
  }).catch(e=>{
    alert("Error saving score");
    console.error(e);
  });
}
</script>

</body>
</html>
